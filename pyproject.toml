[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orto-prosthesis-annotator"
version = "0.1.0"
description = "Local semantic annotation workstation for lower-limb prosthesis STL scans"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ORTO-INNOVATIONS" }]
dependencies = [
  "numpy>=1.26,<3",
  "PySide6>=6.7,<7",
  "pyvista>=0.44,<0.47",
  "pyvistaqt>=0.11,<0.12",
  "trimesh>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.scripts]
orto-annotator = "orto_annotator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
